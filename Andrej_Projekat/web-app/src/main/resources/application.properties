spring.application.name=web-app
server.port=${PORT:8080}

# Config server is optional and not deployed in the cloud
spring.cloud.config.enabled=false

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=${EUREKA_TLS:false}
eureka.instance.non-secure-port-enabled=${EUREKA_PLAIN:true}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

spring.thymeleaf.cache=false

# Backend URLs - through the API Gateway
gateway.url=${GATEWAY_URL:http://localhost:8765}
user-service.url=${gateway.url}/user-service
order-service.url=${gateway.url}/order-service
payment-service.url=${gateway.url}/payment-service
catalog-service.url=${gateway.url}/catalog-service

gateway.api-key=${GATEWAY_API_KEY:gateway-api-key}
