<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Potion Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="page-header">
        <h2>My Orders</h2>
        <div class="actions">
            <a href="/cards" class="btn btn-view">Cards</a>
            <form th:action="@{/orders/draft}" method="post">
                <button type="submit" class="btn-new">+ New Order</button>
            </form>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div th:if="${loyalty != null}" class="loyalty-banner">
        <div class="medal"></div>
        <div class="info">
            <div class="tier" th:text="${loyalty.tierName} + ' tier'">BRONZE tier</div>
            <div class="detail">
                Points: <strong th:text="${loyalty.points}">0</strong> &nbsp;|&nbsp;
                Discount: <strong th:text="${#numbers.formatDecimal(loyalty.discountPercent, 1, 2)} + ' %'">0 %</strong>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-msg">
        No orders. Create a new one by clicking "+ New Order".
    </div>

    <div th:each="order : ${orders}" class="order-card">
        <div class="order-header">
            <div>
                <div class="order-id" th:text="'Order #' + ${order.id}">Order</div>
                <div class="order-date" th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">date</div>
            </div>
            <span class="badge"
                  th:classappend="${order.draft} ? 'badge-draft' : 'badge-paid'"
                  th:text="${order.draft} ? 'In Progress' : 'Paid'">Status</span>
        </div>

        <div class="order-body">
            <div th:if="${order.items == null or #lists.isEmpty(order.items)}" class="empty-items">
                (no items)
            </div>
            <div th:each="item : ${order.items}">
                <div class="item-row">
                    <div>
                        <div th:text="${item.productName}">Product</div>
                        <div th:if="${productMap != null and productMap[item.productId] != null}" class="item-meta">
                            <span th:if="${productMap[item.productId].calories != null}" class="calorie-tag"
                                  th:text="${productMap[item.productId].calories} + ' kcal'"></span>
                            <span th:each="a : ${productMap[item.productId].allergens}" class="allergen-tag" th:text="${a.name}"></span>
                        </div>
                        <div th:each="extra : ${item.extras}" style="padding: 2px 0 2px 12px;">
                            <div class="extra-row" style="padding:0;">
                                <span th:text="'+ ' + ${extra.extraName}">Extra</span>
                                <span th:text="${#numbers.formatDecimal(extra.price, 1, 2)} + ' GOLD'" style="margin-left:8px;"></span>
                            </div>
                            <div th:if="${extraMap != null and extraMap[extra.extraId] != null}" class="item-meta" style="padding-left:0;">
                                <span th:if="${extraMap[extra.extraId].calories != null}" class="calorie-tag"
                                      th:text="${extraMap[extra.extraId].calories} + ' kcal'"></span>
                                <span th:each="a : ${extraMap[extra.extraId].allergens}" class="allergen-tag" th:text="${a.name}"></span>
                            </div>
                        </div>
                    </div>
                    <span class="item-price"
                          th:text="${#numbers.formatDecimal(item.price, 1, 2)} + ' GOLD'">0 GOLD</span>
                </div>
            </div>
        </div>

        <div class="order-footer">
            <span class="total"
                  th:text="'Total: ' + ${#numbers.formatDecimal(order.totalPrice, 1, 2)} + ' GOLD'">TOTAL</span>
            <div class="actions">
                <a th:if="${order.draft}" th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-continue">CONTINUE</a>
                <a th:if="${order.draft}" th:href="@{/orders/{id}/pay(id=${order.id})}" class="btn btn-pay">PAY</a>
                <a th:if="${order.paid}"  th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-view">DETAILS</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
