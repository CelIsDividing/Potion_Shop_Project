<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile - Potion Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h2>Profile</h2>
    <section class="profile">
        <p><strong>Name:</strong> <span th:text="${user.name}">-</span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}">-</span></p>
        <div th:if="${user.loyaltyAccount != null}">
            <p><strong>Loyalty points:</strong> <span th:text="${user.loyaltyAccount.points}">0</span></p>
            <p><strong>Tier:</strong> <span th:text="${user.loyaltyAccount.tier}">BRONZE</span></p>
        </div>
    </section>
</div>
</body>
</html>
