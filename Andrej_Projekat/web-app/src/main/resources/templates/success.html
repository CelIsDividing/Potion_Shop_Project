<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Successful - Potion Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="success-page">
<header class="site-header">
    <a class="brand" th:href="@{/orders}">Potion Store</a>
</header>

<div class="container">
    <div class="success-icon"></div>
    <h1>Payment Successful!</h1>
    <p>Your potion order has been confirmed. Thank you for your purchase!</p>
    <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="btn-new">Back to the shop</button>
    </form>
</div>
</body>
</html>
