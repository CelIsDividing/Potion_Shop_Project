<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order - Potion Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <a href="/orders" class="back-link">&larr; Back to orders</a>

    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <h2>New Order</h2>

    <div class="layout-grid">
        <div>
            <div class="card-box">
                <h3>Items</h3>
                <div th:if="${cart == null or #lists.isEmpty(cart)}" class="empty-items">
                    Add your first items &rarr;
                </div>
                <div th:each="item, iterStat : ${cart}">
                    <div class="item-row">
                        <div style="flex:1;">
                            <div style="font-weight:600;" th:text="${item.productName}">Product</div>
                            <div th:if="${productMap != null and productMap[item.productId] != null}" class="item-meta">
                                <span th:if="${productMap[item.productId].calories != null}" class="calorie-tag"
                                      th:text="${productMap[item.productId].calories} + ' kcal'"></span>
                                <span th:each="a : ${productMap[item.productId].allergens}" class="allergen-tag" th:text="${a.name}"></span>
                            </div>
                            <div th:each="extra : ${item.extras}" style="margin-top:4px;padding-left:12px;border-left:2px solid rgba(122,92,52,.3);">
                                <div style="display:flex;justify-content:space-between;font-size:0.88rem;color:#6f5940;">
                                    <span th:text="'+ ' + ${extra.extraName}">Extra</span>
                                    <span th:text="'+' + ${#numbers.formatDecimal(extra.price,1,2)} + ' GOLD'" style="margin-left:10px;white-space:nowrap;"></span>
                                </div>
                                <div th:if="${extraMap != null and extraMap[extra.extraId] != null}" class="item-meta">
                                    <span th:if="${extraMap[extra.extraId].calories != null}" class="calorie-tag"
                                          th:text="${extraMap[extra.extraId].calories} + ' kcal'"></span>
                                    <span th:each="a : ${extraMap[extra.extraId].allergens}" class="allergen-tag" th:text="${a.name}"></span>
                                </div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:flex-start;gap:8px;flex-shrink:0;margin-left:12px;">
                            <span class="item-price" th:text="${#numbers.formatDecimal(item.totalPrice,1,2)} + ' GOLD'">0 GOLD</span>
                            <form th:action="@{/cart/items/{idx}/remove(idx=${iterStat.index})}" method="post" style="display:inline;">
                                <button type="submit" class="remove-btn" title="Remove">&times;</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:if="${cart != null and not #lists.isEmpty(cart)}" class="total-row">
                    <span>Total</span>
                    <span th:text="${#numbers.formatDecimal(totalPrice,1,2)} + ' GOLD'">0 GOLD</span>
                </div>
            </div>

            <a th:href="@{/cart/pay}"
               class="pay-btn"
               th:classappend="${cart == null or #lists.isEmpty(cart)} ? ' disabled'">
                Pay for Order
            </a>
        </div>

        <div>
            <div class="card-box">
                <h3>Add Product</h3>
                <form th:action="@{/cart/items}" method="post" id="addItemForm">
                    <input type="hidden" id="productName"  name="productName" value="">
                    <input type="hidden" id="productPrice" name="productPrice" value="">

                    <div class="form-group">
                        <label for="productSelect">Product</label>
                        <select id="productSelect" name="productId" required onchange="onProductChange(this)">
                            <option value="" disabled selected>-- Select --</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.id}"
                                    th:attr="data-price=${p.price},data-name=${p.name}"
                                    th:text="${p.name} + ' (' + ${#numbers.formatDecimal(p.price,1,2)} + ' GOLD)'">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Price</label>
                        <input type="text" class="price-display" id="productPriceDisplay" readonly placeholder="0.00 GOLD">
                    </div>

                    <div class="form-group" th:if="${extras != null and not #lists.isEmpty(extras)}">
                        <label>Add-ons (optional)</label>
                        <div class="extras-grid">
                            <div th:each="e : ${extras}" class="extra-check">
                                <input type="checkbox"
                                       th:id="'extra_' + ${e.id}"
                                       name="extraIds"
                                       th:value="${e.id}"
                                       th:attr="data-name=${e.name}, data-price=${e.price}">
                                <label th:for="'extra_' + ${e.id}"
                                       style="font-weight:normal;cursor:pointer;"
                                       th:text="${e.name} + ' (+' + ${#numbers.formatDecimal(e.price,1,2)} + ' GOLD)'">
                                </label>
                            </div>
                        </div>
                    </div>

                    <div id="extraHiddens"></div>
                    <button type="submit" class="btn-add" onclick="buildExtraHiddens()">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function onProductChange(sel) {
        const opt = sel.options[sel.selectedIndex];
        const price = opt.getAttribute('data-price') || '';
        const name  = opt.getAttribute('data-name')  || '';
        document.getElementById('productPriceDisplay').value = price ? parseFloat(price).toFixed(2) + ' GOLD' : '';
        document.getElementById('productPrice').value = price;
        document.getElementById('productName').value  = name;
    }

    function buildExtraHiddens() {
        const cont = document.getElementById('extraHiddens');
        cont.innerHTML = '';
        document.querySelectorAll('input[name="extraIds"]:checked').forEach(cb => {
            const name  = cb.getAttribute('data-name');
            const price = cb.getAttribute('data-price');
            cont.insertAdjacentHTML('beforeend',
                `<input type="hidden" name="extraNames"  value="${name}">` +
                `<input type="hidden" name="extraPrices" value="${price}">`
            );
        });
    }
</script>
</body>
</html>
