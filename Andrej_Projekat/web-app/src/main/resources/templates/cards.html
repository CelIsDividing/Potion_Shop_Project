<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cards - Potion Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <a href="/orders" class="back-link">&larr; Back to Orders</a>

    <div class="page-header">
        <h2>My Cards</h2>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div th:if="${!#lists.isEmpty(cards)}" class="card-list">
        <div th:each="card : ${cards}" class="credit-card">
            <div class="card-info">
                <div class="card-number" th:text="'**** **** **** ' + ${card.lastFourDigits}">**** **** **** 1234</div>
                <div class="card-holder" th:text="${card.cardHolder}">FIRST LAST</div>
                <div class="card-expiry" th:text="'Valid until: ' + ${card.expiryMonth} + '/' + ${card.expiryYear}">Valid until: 12/2027</div>
            </div>
            <div class="card-actions">
                <form th:action="'/cards/' + ${card.id} + '/delete'" method="post"
                      onsubmit="return confirm('Delete card ' + this.dataset.last + '?')"
                      th:attr="data-last='**** ' + ${card.lastFourDigits}">
                    <button type="submit" class="btn-delete-card">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cards)}" class="empty-state">
        <p>You have no saved cards.<br>Add your first card below.</p>
    </div>

    <div class="add-card-box">
        <h3>Add New Card</h3>
        <form action="/cards" method="post" id="addCardForm">

            <div class="form-group">
                <label>Card Holder Name</label>
                <input type="text" name="cardHolder" id="cardHolder"
                       placeholder="e.g. Ana Jovanovic" required maxlength="100"/>
            </div>

            <div class="form-group">
                <label>Card Number</label>
                <input type="text" name="cardNumber" id="cardNumber"
                       placeholder="1234 5678 9012 3456"
                       maxlength="19" required autocomplete="cc-number"/>
                <div class="security-note">
                    <span>Card number is not stored &mdash; we only keep the last 4 digits.</span>
                </div>
            </div>

            <div class="form-row-3">
                <div class="form-group" style="margin-bottom:0;">
                    <label>CVV</label>
                    <input type="password" name="cvv" id="cvv"
                           placeholder="123" maxlength="4" required autocomplete="cc-csc"/>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Expiration Month</label>
                    <input type="number" name="expiryMonth" id="expiryMonth"
                           placeholder="MM" min="1" max="12" required autocomplete="cc-exp-month"/>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Expiry Year</label>
                    <input type="number" name="expiryYear" id="expiryYear"
                           placeholder="YYYY" min="2024" max="2040" required autocomplete="cc-exp-year"/>
                </div>
            </div>

            <div style="margin-top:20px;">
                <button type="submit" class="btn-add">Save Card</button>
                <p class="security-note" style="margin-top:10px;justify-content:center;">
                    <span>CVV is not stored and is used only for validation.</span>
                </p>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('cardNumber').addEventListener('input', function (e) {
        let val = e.target.value.replace(/\D/g, '').substring(0, 16);
        e.target.value = val.replace(/(.{4})/g, '$1 ').trim();
    });

    document.getElementById('cvv').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
    });

    document.getElementById('addCardForm').addEventListener('submit', function (e) {
        const num = document.getElementById('cardNumber').value.replace(/\s/g, '');
        const cvv = document.getElementById('cvv').value;
        const month = parseInt(document.getElementById('expiryMonth').value);
        const year = parseInt(document.getElementById('expiryYear').value);
        const now = new Date();

        if (num.length !== 16) {
            e.preventDefault();
            alert('Card number must have exactly 16 digits.');
            return;
        }
        if (cvv.length < 3) {
            e.preventDefault();
            alert('CVV must have 3 or 4 digits.');
            return;
        }
        if (year < now.getFullYear() || (year === now.getFullYear() && month < now.getMonth() + 1)) {
            e.preventDefault();
            alert('Card has expired.');
        }
    });
</script>
</body>
</html>
