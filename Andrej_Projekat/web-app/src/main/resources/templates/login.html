<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Potion Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="login-page">
    <div class="container note">
        <div class="brand">
            <div class="brand-logo">PS</div>
            <h1>Potion Store</h1>
            <p class="subtitle">Speak the right words to be allowed entry</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post" class="login-form">
            <label for="email">What do people call you?</label>
            <input type="email" id="email" name="email" required
                   placeholder="e.g. ana.jovanovic@example.com" autocomplete="email"/>
            <label for="password">SPEAK THE MAGIC WORDS!!!!!</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"/>
            <button type="submit">PROCEED FORWARD</button>
        </form>
    </div>
</body>
</html>
