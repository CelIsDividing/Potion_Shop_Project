spring.application.name=order-service
server.port=${PORT:8001}

# Config server is optional and not deployed in the cloud
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.enabled=false

# Database configuration (values come from environment variables in the cloud;
# the defaults below point at a locally running PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/potionShop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Service discovery (Eureka)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=${EUREKA_TLS:false}
eureka.instance.non-secure-port-enabled=${EUREKA_PLAIN:true}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}
