spring.application.name=api-gateway
server.port=${PORT:8765}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:api-gateway}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.secure-port-enabled=${EUREKA_TLS:false}
eureka.instance.non-secure-port-enabled=${EUREKA_PLAIN:true}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# Enable routing via service names from Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.discovery.locator.filters[0].name=StripPrefix
spring.cloud.gateway.discovery.locator.filters[0].args.parts=1

# Internal service-to-service API key (used by web-app Feign clients)
gateway.security.api-key=${GATEWAY_API_KEY:gateway-api-key}

# JWT secret - must match user-service
jwt.secret=${JWT_SECRET:Potion-shop-secret-key-must-be-32bytes!}

# Config server is optional and not deployed in the cloud
spring.cloud.config.enabled=false

# Expose actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Application info displayed at /actuator/info
info.app.name=API Gateway
info.app.description=API Gateway for Potion Shop Microservices
info.app.version=1.0.0
