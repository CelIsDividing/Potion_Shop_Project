spring.application.name=api-gateway
server.port=8765

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Enable routing via service names from Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.discovery.locator.filters[0].name=StripPrefix
spring.cloud.gateway.discovery.locator.filters[0].args.parts=1

# Internal service-to-service API key (used by web-app Feign clients)
gateway.security.api-key=gateway-api-key

# JWT secret - must match user-service
jwt.secret=Potion-shop-secret-key-must-be-32bytes!
# Expose actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Application info displayed at /actuator/info
info.app.name=API Gateway
info.app.description=API Gateway for Potion Shop Microservices
info.app.version=1.0.0
info.app.encoding=${project.build.sourceEncoding}
info.app.java.version=${java.version}
info.company.name=Potion Shop