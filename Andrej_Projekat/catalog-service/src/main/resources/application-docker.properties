spring.application.name=catalog-service
server.port=${PORT:8004}

# Database configuration (values come from environment variables in the cloud)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/potionShop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Config server is optional and not deployed in the cloud
spring.cloud.config.enabled=false

# Service discovery (Eureka)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:catalog-service}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.secure-port-enabled=${EUREKA_TLS:false}
eureka.instance.non-secure-port-enabled=${EUREKA_PLAIN:true}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}
